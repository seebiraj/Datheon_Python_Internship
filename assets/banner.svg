      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bae6fd">⚡ ZERO PAID LIBS</text>
    </g>

    <!-- Badge 4: Verified Proof of Work -->
    <g transform="translate(525, 0)">
      <rect width="175" height="32" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f5d0fe">★ DIRECTORATE AUDIT</text>
    </g>
  </g>

  <!-- Right Visual Terminal Graphic -->
  <g transform="translate(800, 45)">
    <!-- Window frame -->
    <rect width="340" height="270" rx="12" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <!-- Window header -->
