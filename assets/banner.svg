<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Circuit Pattern Background Grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300" />
    <path d="M 120 0 L 120 360 M 240 0 L 240 360 M 360 0 L 360 360 M 480 0 L 480 360 M 600 0 L 600 360 M 720 0 L 720 360 M 840 0 L 840 360 M 960 0 L 960 360 M 1080 0 L 1080 360" />
  </g>

  <!-- Glowing Ambient Orbs -->
  <circle cx="150" cy="180" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1050" cy="160" r="140" fill="#818cf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Datheon Logo Badge -->
  <g transform="translate(60, 45)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="6" fill="#38bdf8"/>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="1.5">DATHEON TECH</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Python Programming Internship
  </text>

  <!-- Subtitle -->
  <text x="60" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Enterprise Standard · Core Python, Financial Analytics, OS Automation, NLP Chatbots &amp; OOP Architecture
  </text>

  <!-- Candidate & Program Metadata Pill -->
  <g transform="translate(60, 225)">
    <rect width="640" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" fill="#cbd5e1">
      <tspan fill="#38bdf8" font-weight="bold">Candidate:</tspan> seebiraj &nbsp;|&nbsp; 
      <tspan fill="#38bdf8" font-weight="bold">ID:</tspan> DT-2026-WH8V5 &nbsp;|&nbsp; 
      <tspan fill="#38bdf8" font-weight="bold">Batch:</tspan> 01 (Jeppiaar)
    </text>
  </g>

  <!-- Milestone Badges -->
  <g transform="translate(60, 290)">
    <!-- Badge 1: 5 of 5 Tasks -->
    <g transform="translate(0, 0)">
      <rect width="165" height="32" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#86efac">✓ 5 / 5 TASKS READY</text>
    </g>

    <!-- Badge 2: Python 3.13 -->
    <g transform="translate(180, 0)">
      <rect width="135" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">🐍 PYTHON 3.13</text>
    </g>

    <!-- Badge 3: 100% Free / Standard Library -->
