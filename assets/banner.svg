    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="110" y="22" font-family="monospace" font-size="11" fill="#64748b">datheon-core ~ terminal</text>

    <!-- Terminal Code Mockup -->
    <g font-family="'Fira Code', 'Cascadia Code', monospace" font-size="11" fill="#e2e8f0" transform="translate(20, 55)">
      <text y="15" fill="#38bdf8">$ python -m pytest tests/ -v</text>
      <text y="38" fill="#10b981">✓ test_task1_hangman.py PASSED</text>
      <text y="58" fill="#10b981">✓ test_task2_portfolio.py PASSED</text>
      <text y="78" fill="#10b981">✓ test_task3_organizer.py PASSED</text>
      <text y="98" fill="#10b981">✓ test_task4_chatbot.py PASSED</text>
      <text y="118" fill="#10b981">✓ test_task5_inventory.py PASSED</text>
      <text y="145" fill="#a855f7">==============================</text>
      <text y="165" fill="#22c55e" font-weight="bold">100% SUCCESS · 5/5 PASSED</text>
      <text y="185" fill="#94a3b8">Verdict: Certificate Qualified</text>
    </g>
