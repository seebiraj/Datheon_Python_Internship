<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Terminal Window Base -->
  <rect width="850" height="420" rx="12" fill="url(#termGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Window Header -->
  <rect width="850" height="38" rx="12" fill="#1e293b"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="19" r="6" fill="#10b981"/>
  <text x="425" y="24" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Task 1: Hangman Interactive Console Terminal</text>

  <!-- Gallows Art Left Column -->
  <g transform="translate(45, 60)" font-family="'Courier New', Courier, monospace" font-size="15" fill="#38bdf8" xml:space="preserve">
    <text y="20">     +---+</text>
    <text y="40">     |   |</text>
    <text y="60">     O   |</text>
    <text y="80">    /|\  |</text>
    <text y="100">    /    |</text>
    <text y="120">         |</text>
    <text y="140">   =========</text>
  </g>

  <!-- Right Details Column -->
  <g transform="translate(320, 70)" font-family="'Fira Code', 'Segoe UI', monospace">
    <!-- Header -->
    <text y="20" font-size="18" font-weight="bold" fill="#f8fafc">DATHEON CONSOLE HANGMAN CHALLENGE</text>
    <text y="45" font-size="12" fill="#94a3b8">Attempts Remaining: <tspan fill="#f59e0b" font-weight="bold">1 / 6</tspan> | Mistakes Made: 5</text>

    <!-- Word display -->
    <rect x="0" y="65" width="480" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="103" font-size="24" font-weight="bold" fill="#38bdf8" letter-spacing="8" text-anchor="middle">_ A T H E O N</text>

    <!-- Guessed Letters -->
    <text x="0" y="155" font-size="13" fill="#cbd5e1">Guessed Letters : <tspan fill="#ec4899">A, E, H, N, O, T, X, Y, Z, Q</tspan></text>
    <text x="0" y="180" font-size="13" fill="#cbd5e1">Duplicate Guard : <tspan fill="#10b981">✓ Active (Zero penalty deduction)</tspan></text>
    <text x="0" y="205" font-size="13" fill="#cbd5e1">Next Guess Input: <tspan fill="#f8fafc">D</tspan></text>

    <!-- Success Outcome Preview Box -->
    <rect x="0" y="235" width="480" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="262" font-size="14" font-weight="bold" fill="#34d399">🎉 VICTORY UNLOCKED!</text>
    <text x="20" y="287" font-size="12" fill="#a7f3d0">Secret Word: 'DATHEON' · You saved him with 1 attempt remaining!</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <rect x="0" y="380" width="850" height="40" rx="0" fill="#020617"/>
  <text x="20" y="405" font-family="monospace" font-size="11" fill="#64748b">Status: Normal execution | Encoding: UTF-8 | Input Sanitization: [A-Z] Regex Enforced</text>
</svg>
