<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <!-- Window Frame -->
  <rect width="850" height="420" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect width="850" height="38" rx="12" fill="#1e293b"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="19" r="6" fill="#10b981"/>
  <text x="425" y="24" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Task 2: Stock Portfolio Performance Tracker &amp; CSV Audit</text>

  <!-- Metric Summary Cards -->
  <g transform="translate(40, 55)">
    <!-- Card 1: Invested -->
    <rect x="0" y="0" width="235" height="75" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="18" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8">TOTAL INVESTED CAPITAL</text>
    <text x="18" y="58" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8">$14,705.00</text>

    <!-- Card 2: Current Valuation -->
    <rect x="265" y="0" width="235" height="75" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="18" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8">CURRENT PORTFOLIO VALUE</text>
    <text x="18" y="58" font-family="monospace" font-size="22" font-weight="bold" fill="#34d399">$16,548.70</text>

    <!-- Card 3: Net Return -->
    <rect x="530" y="0" width="240" height="75" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
    <text x="18" y="25" font-family="sans-serif" font-size="11" fill="#94a3b8">NET UNREALIZED GAIN</text>
    <text x="18" y="58" font-family="monospace" font-size="22" font-weight="bold" fill="#4ade80">+$1,843.70 (+12.54%)</text>
  </g>

  <!-- Stock Positions Table -->
  <g transform="translate(40, 150)" font-family="'Fira Code', 'Courier New', monospace" font-size="11">
    <rect width="770" height="190" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect width="770" height="30" rx="8" fill="#1e293b"/>
    <text x="15" y="20" fill="#94a3b8" font-weight="bold">TICKER   COMPANY               SHARES   BUY PRICE   CMP         INVESTED     VALUATION    GAIN/LOSS</text>
    
    <!-- Rows -->
    <g transform="translate(15, 52)">
      <text y="0" fill="#f8fafc">AAPL     Apple Inc.            15.00    $150.00     $182.50     $2,250.00    $2,737.50    <tspan fill="#4ade80">+$487.50 (+21.67%)</tspan></text>
      <text y="24" fill="#f8fafc">NVDA     NVIDIA Corporation    25.00    $95.00      $130.40     $2,375.00    $3,260.00    <tspan fill="#4ade80">+$885.00 (+37.26%)</tspan></text>
      <text y="48" fill="#f8fafc">MSFT     Microsoft Corp.       10.00    $390.00     $425.20     $3,900.00    $4,252.00    <tspan fill="#4ade80">+$352.00 (+9.03%)</tspan></text>
      <text y="72" fill="#f8fafc">TSLA     Tesla Inc.            12.00    $240.00     $215.60     $2,880.00    $2,587.20    <tspan fill="#f87171">-$292.80 (-10.17%)</tspan></text>
      <text y="96" fill="#f8fafc">AMZN     Amazon.com Inc.       20.00    $165.00     $185.30     $3,300.00    $3,706.00    <tspan fill="#4ade80">+$406.00 (+12.30%)</tspan></text>
    </g>
  </g>

  <!-- Footer Banner showing CSV Persistence -->
  <g transform="translate(40, 360)">
    <rect width="770" height="42" rx="6" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" fill="#a7f3d0">
      💾 <tspan font-weight="bold">Generated File:</tspan> 'portfolio_summary.csv' exported via Python's standard csv.DictWriter module.
    </text>
  </g>
</svg>
