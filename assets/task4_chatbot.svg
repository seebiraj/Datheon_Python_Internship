<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <!-- Window Frame -->
  <rect width="850" height="420" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect width="850" height="38" rx="12" fill="#1e293b"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="19" r="6" fill="#10b981"/>
  <text x="425" y="24" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Task 4: Rule-Based Conversational Chatbot &amp; Regex NLP</text>

  <!-- Left: State Machine -->
  <g transform="translate(40, 60)">
    <rect width="230" height="280" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="230" height="32" rx="8" fill="#4338ca"/>
    <text x="115" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Dialogue State Machine</text>

    <!-- State Bubbles -->
    <g transform="translate(25, 48)">
      <rect x="0" y="0" width="180" height="32" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
      <text x="90" y="21" font-family="sans-serif" font-size="11" fill="#c7d2fe" font-weight="bold" text-anchor="middle">1. INIT / GREETING</text>

      <line x1="90" y1="32" x2="90" y2="48" stroke="#818cf8" stroke-width="2"/>

      <rect x="0" y="48" width="180" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="90" y="69" font-family="sans-serif" font-size="11" fill="#bfdbfe" font-weight="bold" text-anchor="middle">2. INPUT NORMALIZATION</text>

      <line x1="90" y1="80" x2="90" y2="96" stroke="#818cf8" stroke-width="2"/>

      <rect x="0" y="96" width="180" height="32" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
      <text x="90" y="117" font-family="sans-serif" font-size="11" fill="#a7f3d0" font-weight="bold" text-anchor="middle">3. INTENT RESOLUTION</text>

      <line x1="90" y1="128" x2="90" y2="144" stroke="#818cf8" stroke-width="2"/>

      <rect x="0" y="144" width="180" height="32" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
      <text x="90" y="165" font-family="sans-serif" font-size="11" fill="#fde68a" font-weight="bold" text-anchor="middle">4. CONFIDENCE FALLBACK</text>

      <line x1="90" y1="176" x2="90" y2="192" stroke="#818cf8" stroke-width="2"/>

      <rect x="0" y="192" width="180" height="32" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
      <text x="90" y="213" font-family="sans-serif" font-size="11" fill="#fecdd3" font-weight="bold" text-anchor="middle">5. TEARDOWN &amp; EXIT</text>
    </g>
  </g>

  <!-- Right: Conversation Flow Mockup -->
  <g transform="translate(290, 60)">
    <rect width="520" height="280" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="520" height="32" rx="8" fill="#1e293b"/>
    <text x="20" y="21" font-family="monospace" font-size="12" fill="#94a3b8">Transcript: Interactive Assistant Session</text>

    <g transform="translate(20, 50)" font-family="'Segoe UI', sans-serif" font-size="12">
      <!-- Bot Msg 1 -->
      <text y="15" fill="#38bdf8" font-weight="bold">Datheon Nova:</text>
      <text y="32" fill="#cbd5e1">Hello! Welcome to Datheon Support. How can I assist you today?</text>

      <!-- User Msg 1 -->
      <text y="60" fill="#a855f7" font-weight="bold">You:</text>
      <text y="77" fill="#f8fafc">Tell me about the Datheon Python Internship and certificate!</text>

      <!-- Bot Msg 2 -->
      <text y="105" fill="#38bdf8" font-weight="bold">Datheon Nova [Intent: datheon_internship]:</text>
      <text y="122" fill="#cbd5e1">The Datheon Python Programming Internship is a 4-week industry challenge.</text>
      <text y="138" fill="#cbd5e1">Complete 2-3 tasks, push to GitHub, and receive your QR-coded Verified Certificate!</text>

      <!-- User Msg 2 -->
      <text y="165" fill="#a855f7" font-weight="bold">You:</text>
      <text y="182" fill="#f8fafc">Thank you so much! Goodbye.</text>

      <!-- Bot Msg 3 -->
      <text y="208" fill="#38bdf8" font-weight="bold">Datheon Nova [Intent: goodbye]:</text>
      <text y="225" fill="#34d399">Goodbye! Have a productive day ahead. Happy coding! [Session Closed]</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(40, 360)">
    <rect width="770" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" fill="#c7d2fe">
      🧠 <tspan font-weight="bold">Decoupled Knowledge Base:</tspan> Configured via 'faq_dataset.json' supporting multi-intent regex patterns and fallbacks.
    </text>
  </g>
</svg>
