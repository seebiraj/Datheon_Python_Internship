<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <!-- Window Base -->
  <rect width="850" height="420" rx="12" fill="#090d16" stroke="#334155" stroke-width="2"/>
  <rect width="850" height="38" rx="12" fill="#1e293b"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444"/>
  <circle cx="40" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="58" cy="19" r="6" fill="#10b981"/>
  <text x="425" y="24" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Task 3: Automated File Organizer &amp; Collision Resolution</text>

  <!-- Left: Cluttered Directory -->
  <g transform="translate(40, 65)">
    <rect width="210" height="270" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#b45309"/>
    <text x="105" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">📁 Cluttered Folder</text>
    <g transform="translate(15, 50)" font-family="monospace" font-size="11" fill="#f8fafc">
      <text y="15">📄 report.pdf</text>
      <text y="38">📄 report.pdf (new)</text>
      <text y="61">🖼️ photo.jpg</text>
      <text y="84">📊 sheet.xlsx</text>
      <text y="107">📦 backup.zip</text>
      <text y="130">🎬 video.mp4</text>
      <text y="153">🐍 script.py</text>
      <text y="176">🎵 song.mp3</text>
      <text y="199" fill="#94a3b8">... +120 files</text>
    </g>
  </g>

  <!-- Middle: Engine Pipeline & Collision Resolver -->
  <g transform="translate(290, 80)">
    <!-- Pipeline Box -->
    <rect width="270" height="240" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="135" y="30" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">⚡ ORGANIZER ENGINE</text>
    <line x1="20" y1="45" x2="250" y2="45" stroke="#334155" stroke-width="1"/>
    
    <g transform="translate(20, 65)" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      <text y="10" font-weight="bold" fill="#f8fafc">1. Extension Parsing:</text>
      <text y="28" fill="#94a3b8">Matches suffix to CATEGORY_MAP</text>
      
      <text y="58" font-weight="bold" fill="#f8fafc">2. Collision Safeguard:</text>
      <text y="76" fill="#f59e0b">report.pdf ➜ report_1.pdf</text>
      
      <text y="106" font-weight="bold" fill="#f8fafc">3. Exception Handling:</text>
      <text y="124" fill="#94a3b8">try-except PermissionError</text>
      
      <text y="154" font-weight="bold" fill="#f8fafc">4. Safe Atomic Move:</text>
      <text y="172" fill="#34d399">shutil.move() via pathlib.Path</text>
    </g>
  </g>

  <!-- Right: Sorted Clean Categories -->
  <g transform="translate(600, 65)">
    <rect width="210" height="270" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="32" rx="8" fill="#047857"/>
    <text x="105" y="21" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✨ Structured Folders</text>
    <g transform="translate(15, 50)" font-family="sans-serif" font-size="11" fill="#f8fafc">
      <text y="15" fill="#38bdf8">📁 /Documents (2)</text>
      <text y="38" fill="#ec4899">📁 /Images (1)</text>
      <text y="61" fill="#a855f7">📁 /Videos (1)</text>
      <text y="84" fill="#f59e0b">📁 /Archives (1)</text>
      <text y="107" fill="#10b981">📁 /Code (1)</text>
      <text y="130" fill="#06b6d4">📁 /Audio (1)</text>
      <text y="153" fill="#64748b">📁 /Executables (0)</text>
      <text y="176" fill="#64748b">📁 /Other (0)</text>
      <text y="200" font-weight="bold" fill="#34d399">✓ 100% Relocated</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 250 200 L 290 200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 560 200 L 600 200" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer Banner -->
  <g transform="translate(40, 360)">
    <rect width="770" height="42" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" fill="#c7d2fe">
      🛡️ <tspan font-weight="bold">Dry-Run Preview:</tspan> Execute with '--dry-run' to audit relocations with zero risk to filesystem contents.
    </text>
  </g>
</svg>
