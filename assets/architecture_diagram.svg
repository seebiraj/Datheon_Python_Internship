      <text y="35" fill="#94a3b8">• demo_run.py</text>
      <text y="55" fill="#94a3b8">• category_map</text>
      <line x1="0" y1="70" x2="160" y2="70" stroke="#334155" stroke-width="1"/>
      <text y="90" font-family="sans-serif" font-size="10" fill="#e2e8f0">os.scandir Pipeline</text>
      <text y="110" font-family="sans-serif" font-size="10" fill="#e2e8f0">Collision Resolver</text>
      <text y="130" font-family="sans-serif" font-size="10" fill="#e2e8f0">Safe shutil.move</text>
      <text y="155" font-family="sans-serif" font-size="10" fill="#22c55e">✓ Dry-Run Preview</text>
    </g>
  </g>

  <!-- Task 4: Chatbot -->
  <g transform="translate(670, 160)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#4338ca"/>
    <text x="95" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASK 4 · CHATBOT</text>
