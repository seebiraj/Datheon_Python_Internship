<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="520" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="50" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">
    System Architecture &amp; Task Pipeline Hierarchy
  </text>
  <text x="50" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">
    Enterprise Modular Design for Datheon Python Programming Internship (Tasks 1 through 5)
  </text>

  <!-- Central Core Bus -->
  <line x1="100" y1="120" x2="1000" y2="120" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6"/>
  <rect x="420" y="102" width="260" height="36" rx="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    PYTHON 3 STANDARD RUNTIME
  </text>

  <!-- 5 Task Architectural Modules -->

  <!-- Task 1: Hangman -->
  <g transform="translate(40, 160)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#0369a1"/>
    <text x="95" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASK 1 · HANGMAN</text>
    <g transform="translate(15, 50)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text y="15" fill="#38bdf8">• hangman.py</text>
      <text y="35" fill="#94a3b8">• words.txt</text>
      <text y="55" fill="#94a3b8">• demo_run.py</text>
      <line x1="0" y1="70" x2="160" y2="70" stroke="#334155" stroke-width="1"/>
      <text y="90" font-family="sans-serif" font-size="10" fill="#e2e8f0">String Processing</text>
      <text y="110" font-family="sans-serif" font-size="10" fill="#e2e8f0">ASCII Gallows Art</text>
      <text y="130" font-family="sans-serif" font-size="10" fill="#e2e8f0">State Deduction</text>
      <text y="155" font-family="sans-serif" font-size="10" fill="#22c55e">✓ Zero-Penalty Dupes</text>
    </g>
  </g>

  <!-- Task 2: Portfolio -->
  <g transform="translate(250, 160)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#047857"/>
    <text x="95" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASK 2 · PORTFOLIO</text>
    <g transform="translate(15, 50)" font-family="monospace" font-size="11" fill="#cbd5e1">
      <text y="15" fill="#10b981">• portfolio.py</text>
      <text y="35" fill="#94a3b8">• sp500_tickers.csv</text>
      <text y="55" fill="#94a3b8">• portfolio_summary.csv</text>
      <line x1="0" y1="70" x2="160" y2="70" stroke="#334155" stroke-width="1"/>
      <text y="90" font-family="sans-serif" font-size="10" fill="#e2e8f0">Valuation Engine</text>
      <text y="110" font-family="sans-serif" font-size="10" fill="#e2e8f0">Weighted Average Buy</text>
      <text y="130" font-family="sans-serif" font-size="10" fill="#e2e8f0">Gain / Loss Metrics</text>
      <text y="155" font-family="sans-serif" font-size="10" fill="#22c55e">✓ CSV Persistence</text>
    </g>
  </g>

  <!-- Task 3: Organizer -->
  <g transform="translate(460, 160)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#b45309"/>
    <text x="95" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASK 3 · ORGANIZER</text>
    <g transform="translate(15, 50)" font-family="monospace" font-size="11" fill="#cbd5e1">
