  <!-- Task 5: OOP Inventory -->
  <g transform="translate(880, 160)" filter="url(#shadow)">
    <rect width="190" height="230" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#be185d"/>
    <text x="95" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TASK 5 · OOP ASSETS</text>
