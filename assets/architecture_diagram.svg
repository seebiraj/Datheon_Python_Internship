      <text y="15" fill="#ec4899">• models.py</text>
      <text y="35" fill="#94a3b8">• inventory.py</text>
      <text y="55" fill="#94a3b8">• demo_run.py</text>
      <line x1="0" y1="70" x2="160" y2="70" stroke="#334155" stroke-width="1"/>
      <text y="90" font-family="sans-serif" font-size="10" fill="#e2e8f0">ABC &amp; Encapsulation</text>
      <text y="110" font-family="sans-serif" font-size="10" fill="#e2e8f0">Polymorphic Overdue</text>
      <text y="130" font-family="sans-serif" font-size="10" fill="#e2e8f0">Dunder Methods</text>
      <text y="155" font-family="sans-serif" font-size="10" fill="#22c55e">✓ Tabular Audit Trail</text>
    </g>
  </g>

  <!-- Bottom Global Validation Banner -->
  <g transform="translate(40, 420)">
    <rect width="1020" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="30" y="36" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">CI &amp; VERIFICATION SUITE:</text>
    <text x="210" y="36" font-family="sans-serif" font-size="13" fill="#cbd5e1">
      Pytest Automated Testing (100% Pass) &nbsp;|&nbsp; GitHub Actions Multi-Version Matrix (3.10 - 3.13) &nbsp;|&nbsp; Zero Paid Dependencies
    </text>
  </g>
</svg>
