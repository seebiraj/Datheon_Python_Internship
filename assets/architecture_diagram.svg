      <text y="90" font-family="sans-serif" font-size="10" fill="#e2e8f0">Regex Intent Matcher</text>
      <text y="110" font-family="sans-serif" font-size="10" fill="#e2e8f0">State Management</text>
      <text y="130" font-family="sans-serif" font-size="10" fill="#e2e8f0">Contextual FAQ</text>
      <text y="155" font-family="sans-serif" font-size="10" fill="#22c55e">✓ Fallback Suggestion</text>
    </g>
